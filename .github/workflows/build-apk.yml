name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install & bundle web
        run: |
          npm ci
          npm run build

      - name: Check secrets
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$GS" ] || { echo "::error::Secret GOOGLE_SERVICES_JSON missing (README step 5)"; exit 1; }
          [ -n "$KS" ] || { echo "::error::Secret DEBUG_KEYSTORE_BASE64 missing (README step 5)"; exit 1; }

      - name: Signing key (fixed SHA-1 for Google login)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "SHA1|SHA256"

      - name: Create Android project
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npx cap add android
          printf '%s' "$GS" > android/app/google-services.json
          node scripts/patch-android.js
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk ../PlantSiteRegisters.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PlantSiteRegisters-apk
          path: PlantSiteRegisters.apk
